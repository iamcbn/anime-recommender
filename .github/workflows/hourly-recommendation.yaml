name: Hourly Anime Recommender Test

on:
  # Fires every hour
  schedule:
    - cron: '0 * * * *'

  # Allow manual runs from the GitHub Actions tab (great for testing)
  workflow_dispatch:

# Grant write access so the action can commit anime_results.jsonl back to main
permissions:
  contents: write

jobs:
  hourly-recommendation:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests google-genai

      # -----------------------------------------------------------------------
      # 4. Run the hourly recommendation script
      # -----------------------------------------------------------------------
      - name: Run hourly_run.py
        id: run_script
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODAL_ACCESS_TOKEN: ${{ secrets.MODAL_ACCESS_TOKEN }}
        run: python scripts/hourly_run.py

      # -----------------------------------------------------------------------
      # 5. Commit and push updated anime_results.jsonl (if it changed)
      # -----------------------------------------------------------------------
      # Always runs — even if the script step had partial failures
      - name: Commit and push results
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the results file
          git add anime_results.jsonl

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to anime_results.jsonl — nothing to commit."
          else
            git commit -m "chore: append hourly anime recommendation result [$(date -u '+%Y-%m-%dT%H:%M:%SZ')]"
            git push
          fi

      # Re-raise the script failure AFTER the commit so the job is still marked red
      - name: Propagate script failure
        if: steps.run_script.outcome == 'failure'
        run: |
          echo "Script had partial failures — marking job as failed."
          exit 1
