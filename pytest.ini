[pytest]
testpaths = test
norecursedirs = anime node_modules .git archive misc .venv venv backend models
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:starlette.*
markers =
    unit: Fast, isolated unit tests with zero network or database access
    integration: Integration tests with local database or mocked internal contracts
    system: End-to-end system and browser automation tests
    regression: Targeted regression tests linked to specific bug fixes or issues
    performance: Latency, throughput, and resource benchmark tests
    non_functional: Security, reliability, resilience, and accessibility tests
    backend: Backend-scoped tests
    fullstack: Fullstack and cross-tier tests
    live_db: Tests requiring a live PostgreSQL test database


