name: Weekly Data Pipeline Update

on:
  # Run automatically every Sunday at 3:00 AM UTC
  schedule:
    - cron: '0 3 * * 0'
  
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if Kaggle dataset is up to date'
        type: boolean
        default: true

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Keep-Alive Dependencies
        run: |
          pip install psycopg2-binary python-dotenv

      - name: Database Keep-Alive & Pre-Flight Check
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: 'require'
        run: |
          python scripts/db_keepalive.py --timeout 5

      - name: Build Data Pipeline Docker Image
        run: |
          # We build the image directly instead of using docker-compose
          # because docker-compose would try to spin up a local database.
          # We want to connect straight to our production Supabase DB!
          docker build -t anime-data-pipeline -f backend/data_pipeline/Dockerfile .

      - name: Run Data Pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p ${{ github.workspace }}/artefacts
          mkdir -p ${{ github.workspace }}/models

          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          docker run --rm \
            -e DB_HOST \
            -e DB_PORT \
            -e DB_NAME \
            -e DB_USER \
            -e DB_PASSWORD \
            -e KAGGLE_USERNAME \
            -e KAGGLE_KEY \
            -e HF_TOKEN \
            -v ${{ github.workspace }}/artefacts:/app/data_pipeline/artefacts \
            -v ${{ github.workspace }}/models:/app/models \
            anime-data-pipeline python -m data_pipeline.run_pipeline $FORCE_FLAG

      - name: Fix File Permissions
        run: |
          # Docker wrote these files as root; make them readable by the runner user
          sudo chown -R "$(id -u):$(id -g)" ${{ github.workspace }}/models ${{ github.workspace }}/artefacts
          sudo chmod -R u+rwX,go+rX ${{ github.workspace }}/models ${{ github.workspace }}/artefacts

      - name: Upload Models to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$(ls -A ${{ github.workspace }}/models)" ]; then
            echo "No new models generated; skipping upload to Modal."
            exit 0
          fi

          pip install modal
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"
          
          # Create the volume explicitly using the Modal Python API to ensure it exists
          python -c "import modal; modal.Volume.from_name('anime-models-vol', create_if_missing=True).hydrate()"
          
          cd ${{ github.workspace }}/models
          modal volume put --force anime-models-vol . /
